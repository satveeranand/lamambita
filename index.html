<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>La Mambita Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Anwesenheit, Verkauf und Gutscheine der Tanzschule La Mambita">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="La Mambita">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { --bg: #ffffff; --ink: #1d1822; --muted: #5d5566; --accent: #b0236e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141118; --ink: #f3eff6; --muted: #bdb4c6; --accent: #e4579d; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; overflow: hidden; }
    #portal { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 2; transition: opacity .35s; padding: 24px; }
    #splash.gone { opacity: 0; pointer-events: none; }
    .box { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 360px; }
    .box img { width: min(280px, 80vw); height: auto; }
    .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(127,127,127,.2); overflow: hidden; position: relative; }
    .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); border-radius: 2px; animation: load 1.1s infinite ease-in-out; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    .msg { color: var(--muted); font-size: .92rem; margin: 0; }
    .btn { display: inline-block; padding: 12px 18px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; border: 0; font-size: 1rem; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid currentColor; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="box">
      <img src="logo.png" alt="La Mambita">
      <div class="bar" id="bar"></div>
      <p class="msg" id="msg">Portal wird geladen …</p>
      <div id="actions" hidden>
        <button class="btn" id="retry">Erneut versuchen</button>
        <p class="msg" style="margin-top:12px"><a class="btn ghost" id="open" target="_blank" rel="noopener">Im Browser öffnen</a></p>
      </div>
    </div>
  </div>
  <iframe id="portal" title="La Mambita Portal" allow="clipboard-write" hidden></iframe>

  <script>
    /* ===== Hier steht der Link zum Portal (Web-App-URL, endet auf /exec) ===== */
    var PORTAL_URL = 'https://script.google.com/macros/s/AKfycbzwhzx6vdhsxxgF3YfgABm9qXyAGvAgJpTdL2vPA8NmF1fiK6SnRLHuRxVCD_mn2skp/exec';

    var frame = document.getElementById('portal'), splash = document.getElementById('splash');
    var msg = document.getElementById('msg'), actions = document.getElementById('actions'), bar = document.getElementById('bar');
    document.getElementById('open').href = PORTAL_URL;
    var slowTimer;
    function load() {
      actions.hidden = true; bar.hidden = false; splash.classList.remove('gone');
      if (!navigator.onLine) return offline();
      msg.textContent = 'Portal wird geladen …';
      frame.hidden = false;
      frame.src = PORTAL_URL;
      clearTimeout(slowTimer);
      slowTimer = setTimeout(function () {
        msg.textContent = 'Das dauert länger als üblich – bitte Internetverbindung prüfen.';
        actions.hidden = false;
      }, 15000);
    }
    function offline() {
      bar.hidden = true;
      msg.textContent = 'Keine Internetverbindung. Das Portal braucht Internet, um Daten zu speichern.';
      actions.hidden = false;
    }
    frame.addEventListener('load', function () { clearTimeout(slowTimer); setTimeout(function () { splash.classList.add('gone'); }, 250); });
    document.getElementById('retry').addEventListener('click', load);
    window.addEventListener('online', function () { if (!splash.classList.contains('gone')) load(); });
    window.addEventListener('offline', function () { if (frame.hidden || !splash.classList.contains('gone')) offline(); });
    /* Anmeldung des Portals in der App speichern (Safari würde sie sonst beim Schließen vergessen).
       Nur Nachrichten vom Google-Portal werden angenommen. */
    var KEY = 'lmPortalToken';
    window.addEventListener('message', function (e) {
      if (!/^https:\/\/[a-z0-9-]+[.-]script\.googleusercontent\.com$/.test(e.origin) || !e.data || !e.data.lm) return;
      try {
        if (e.data.lm === 'set') { if (e.data.token) localStorage.setItem(KEY, e.data.token); else localStorage.removeItem(KEY); }
        if (e.data.lm === 'get') e.source.postMessage({ lm: 'token', token: localStorage.getItem(KEY) || '' }, e.origin);
      } catch (x) {}
    });
    load();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
</body>
</html>
